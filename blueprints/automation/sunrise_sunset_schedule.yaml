blueprint:
  name: Sunrise/Sunset Schedule
  description: Control covers, lights, and switches/fans at sunset, with the opposite happening at sunrise. Each domain has its own action; pick "None" to skip a domain. Optional offsets in minutes (negative = before the sun event).
  domain: automation
  input:
    covers:
      name: Covers
      description: Covers to control. Leave empty to skip.
      default: {}
      selector:
        target:
          entity:
            domain: cover
    cover_sunset_action:
      name: Cover Action at Sunset
      description: What to do with covers at sunset (opposite at sunrise).
      default: "none"
      selector:
        select:
          options:
            - label: Open
              value: "open"
            - label: Close
              value: "close"
            - label: None
              value: "none"
    lights:
      name: Lights
      description: Lights to control. Leave empty to skip.
      default: {}
      selector:
        target:
          entity:
            domain: light
    light_sunset_action:
      name: Light Action at Sunset
      description: What to do with lights at sunset (opposite at sunrise).
      default: "none"
      selector:
        select:
          options:
            - label: Turn On
              value: "on"
            - label: Turn Off
              value: "off"
            - label: None
              value: "none"
    switches:
      name: Switches & Fans
      description: Switches and fans to control. Leave empty to skip.
      default: {}
      selector:
        target:
          entity:
            domain:
              - switch
              - fan
    switch_sunset_action:
      name: Switch/Fan Action at Sunset
      description: What to do with switches and fans at sunset (opposite at sunrise).
      default: "none"
      selector:
        select:
          options:
            - label: Turn On
              value: "on"
            - label: Turn Off
              value: "off"
            - label: None
              value: "none"
    sunset_offset:
      name: Sunset Offset (minutes)
      description: Minutes relative to sunset. Negative = before sunset, positive = after.
      default: 0
      selector:
        number:
          min: -180
          max: 180
          step: 1
          unit_of_measurement: minutes
          mode: box
    sunrise_offset:
      name: Sunrise Offset (minutes)
      description: Minutes relative to sunrise. Negative = before sunrise, positive = after.
      default: 0
      selector:
        number:
          min: -180
          max: 180
          step: 1
          unit_of_measurement: minutes
          mode: box

mode: single

variables:
  cover_sunset_action: !input cover_sunset_action
  light_sunset_action: !input light_sunset_action
  switch_sunset_action: !input switch_sunset_action
  covers: !input covers
  lights: !input lights
  switches: !input switches

triggers:
  - trigger: sun
    event: sunset
    offset:
      minutes: !input sunset_offset
    id: "sunset"

  - trigger: sun
    event: sunrise
    offset:
      minutes: !input sunrise_offset
    id: "sunrise"

condition: []

action:
  - variables:
      is_sunset: "{{ (trigger.id == 'sunset') if (trigger is defined and trigger.id is defined) else (states('sun.sun') == 'below_horizon') }}"
      cover_op: >-
        {%- if cover_sunset_action == 'none' -%}none
        {%- elif is_sunset -%}{{ cover_sunset_action }}
        {%- elif cover_sunset_action == 'open' -%}close
        {%- else -%}open
        {%- endif -%}
      light_op: >-
        {%- if light_sunset_action == 'none' -%}none
        {%- elif is_sunset -%}{{ light_sunset_action }}
        {%- elif light_sunset_action == 'on' -%}off
        {%- else -%}on
        {%- endif -%}
      switch_op: >-
        {%- if switch_sunset_action == 'none' -%}none
        {%- elif is_sunset -%}{{ switch_sunset_action }}
        {%- elif switch_sunset_action == 'on' -%}off
        {%- else -%}on
        {%- endif -%}
      has_covers: "{{ ((covers.entity_id | default([]) | length) + (covers.device_id | default([]) | length) + (covers.area_id | default([]) | length)) > 0 }}"
      has_lights: "{{ ((lights.entity_id | default([]) | length) + (lights.device_id | default([]) | length) + (lights.area_id | default([]) | length)) > 0 }}"
      has_switches: "{{ ((switches.entity_id | default([]) | length) + (switches.device_id | default([]) | length) + (switches.area_id | default([]) | length)) > 0 }}"
  - choose:
      - conditions: "{{ has_covers and cover_op == 'open' }}"
        sequence:
          - action: cover.open_cover
            target: !input covers
      - conditions: "{{ has_covers and cover_op == 'close' }}"
        sequence:
          - action: cover.close_cover
            target: !input covers
  - choose:
      - conditions: "{{ has_lights and light_op == 'on' }}"
        sequence:
          - action: light.turn_on
            target: !input lights
      - conditions: "{{ has_lights and light_op == 'off' }}"
        sequence:
          - action: light.turn_off
            target: !input lights
  - choose:
      - conditions: "{{ has_switches and switch_op == 'on' }}"
        sequence:
          - action: homeassistant.turn_on
            target: !input switches
      - conditions: "{{ has_switches and switch_op == 'off' }}"
        sequence:
          - action: homeassistant.turn_off
            target: !input switches
