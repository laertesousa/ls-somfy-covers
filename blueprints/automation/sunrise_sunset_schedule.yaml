blueprint:
  name: Sunrise/Sunset Schedule
  description: Turn an entity on/off at sunset and the opposite at sunrise, with optional offsets (in minutes; negative = before the sun event).
  domain: automation
  input:
    target_entity:
      name: Entity
      description: The light, switch, fan, or cover to control.
      selector:
        target:
          entity:
            domain:
              - light
              - switch
              - fan
              - cover
    sunset_action:
      name: Action at Sunset
      description: What to do at sunset (the opposite happens at sunrise).
      default: "on"
      selector:
        select:
          options:
            - label: Turn On
              value: "on"
            - label: Turn Off
              value: "off"
    sunset_offset:
      name: Sunset Offset (minutes)
      description: Minutes relative to sunset. Negative = before sunset, positive = after.
      default: 0
      selector:
        number:
          min: -180
          max: 180
          step: 1
          unit_of_measurement: minutes
          mode: box
    sunrise_offset:
      name: Sunrise Offset (minutes)
      description: Minutes relative to sunrise. Negative = before sunrise, positive = after.
      default: 0
      selector:
        number:
          min: -180
          max: 180
          step: 1
          unit_of_measurement: minutes
          mode: box

mode: single

variables:
  sunset_action: !input sunset_action

triggers:
  - trigger: sun
    event: sunset
    offset:
      minutes: !input sunset_offset
    id: "sunset"

  - trigger: sun
    event: sunrise
    offset:
      minutes: !input sunrise_offset
    id: "sunrise"

condition: []

action:
  - variables:
      is_sunset: "{{ (trigger.id == 'sunset') if (trigger is defined and trigger.id is defined) else (states('sun.sun') == 'below_horizon') }}"
      should_open: "{{ is_sunset == (sunset_action == 'on') }}"
      raw_entity_ids: "{{ target_entity.entity_id | default([]) }}"
      raw_device_ids: "{{ target_entity.device_id | default([]) }}"
      raw_area_ids: "{{ target_entity.area_id | default([]) }}"
      direct_entity_ids: "{{ [raw_entity_ids] if raw_entity_ids is string else raw_entity_ids }}"
      device_ids: "{{ [raw_device_ids] if raw_device_ids is string else raw_device_ids }}"
      area_ids: "{{ [raw_area_ids] if raw_area_ids is string else raw_area_ids }}"
      from_devices: "{{ device_ids | map('device_entities') | sum(start=[]) }}"
      from_areas: "{{ area_ids | map('area_entities') | sum(start=[]) }}"
      all_ids: "{{ (direct_entity_ids + from_devices + from_areas) | unique | select('match', '^(cover|light|switch|fan)\\.') | list }}"
  - repeat:
      for_each: "{{ all_ids }}"
      sequence:
        - action: >-
            {%- set domain = repeat.item.split('.')[0] -%}
            {%- if domain == 'cover' -%}
            cover.{{ 'open_cover' if should_open else 'close_cover' }}
            {%- else -%}
            homeassistant.{{ 'turn_on' if should_open else 'turn_off' }}
            {%- endif -%}
          target:
            entity_id: "{{ repeat.item }}"
