blueprint:
  name: Lutron Pico 3BRL - Cover Switch
  description: Easily setup Lutron Pico 3BRL with a cover. Single tap of the open/close buttons opens/closes the cover; double tap of either stops it.
  domain: automation
  input:
    pico_remote:
      name: Pico Remote
      selector:
        device:
          filter:
            - integration: lutron_caseta
              manufacturer: "Lutron Electronics Co., Inc"
              model: "PJ2-3BRL-GXX-X01 (Pico3ButtonRaiseLower)"
    open_button:
      name: Open Button
      description: Pico button that opens the cover (double tap to stop).
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "raise"
            - "stop"
            - "lower"
            - "off"
    close_button:
      name: Close Button
      description: Pico button that closes the cover (double tap to stop).
      default: "off"
      selector:
        select:
          options:
            - "on"
            - "raise"
            - "stop"
            - "lower"
            - "off"
    cover:
      name: Cover
      selector:
        target:
          entity:
            domain: cover

mode: single

triggers:
  - trigger: event
    event_type: lutron_caseta_button_event
    event_data:
      device_id: !input pico_remote
      button_type: !input open_button
      action: press
    id: open

  - trigger: event
    event_type: lutron_caseta_button_event
    event_data:
      device_id: !input pico_remote
      button_type: !input close_button
      action: press
    id: close

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: open
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: lutron_caseta_button_event
                event_data:
                  device_id: !input pico_remote
                  button_type: !input open_button
                  action: press
            timeout: "00:00:00.4"
            continue_on_timeout: true
          - choose:
              - conditions: "{{ wait.trigger is not none }}"
                sequence:
                  - action: cover.stop_cover
                    target: !input cover
            default:
              - action: cover.open_cover
                target: !input cover

      - conditions:
          - condition: trigger
            id: close
        sequence:
          - wait_for_trigger:
              - trigger: event
                event_type: lutron_caseta_button_event
                event_data:
                  device_id: !input pico_remote
                  button_type: !input close_button
                  action: press
            timeout: "00:00:00.4"
            continue_on_timeout: true
          - choose:
              - conditions: "{{ wait.trigger is not none }}"
                sequence:
                  - action: cover.stop_cover
                    target: !input cover
            default:
              - action: cover.close_cover
                target: !input cover
